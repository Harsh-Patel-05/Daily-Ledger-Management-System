databases:
  - name: dlms-db
    plan: basic_256mb
    databaseName: daily_ledger
    user: daily_ledger

services:
  - type: web
    name: dlms-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    # Free plan has no Shell — migrate + optional seed on boot
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://rad-daffodil-c1e125.netlify.app,http://localhost:5173,http://127.0.0.1:5173
      - key: DATABASE_URL
        fromDatabase:
          name: dlms-db
          property: connectionString
